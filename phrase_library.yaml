# 系统键名映射
system_keys:
  annotation: 标注
  language: 语言
  segment: 区间

# 短语库（用于短语选择）
phrases:
  冰箱:
    - 打开冰箱门
    - 从冰箱取出食物
    - 关上冰箱门
  烤箱:
    - 打开烤箱门
    - 将食物放入烤箱
    - 关上烤箱门
  洗碗机:
    - 打开洗碗机门
    - 将餐具放入洗碗机
    - 关上洗碗机门

# 中英文映射（包含英文翻译和同义词）
actions:
  冰箱:
    - 打开冰箱门:
        english: open the fridge door.
        paraphrases:
          - Open the refrigerator door.
          - Swing open the fridge door.
          - Pull the refrigerator door open.

    - 从冰箱取出食物:
        english: take out the food from the fridge.
        paraphrases:
          - Remove the food from the refrigerator.
          - Get the food out of the fridge.
          - Take the food out of the refrigerator.

    - 关上冰箱门:
        english: close the fridge door.
        paraphrases:
          - Shut the refrigerator door.
          - Close the refrigerator door.
          - Push the fridge door closed.

  烤箱:
    - 打开烤箱门:
        english: open the oven door.
        paraphrases:
          - Open the oven.
          - Swing open the oven door.
          - Pull the oven door open.

    - 将食物放入烤箱:
        english: place the food into the oven.
        paraphrases:
          - Put the food in the oven.
          - Load the food into the oven.
          - Place the food inside the oven.

    - 关上烤箱门:
        english: close the oven door.
        paraphrases:
          - Shut the oven door.
          - Close the oven.
          - Push the oven door closed.

  洗碗机:
    - 打开洗碗机门:
        english: open the dishwasher door.
        paraphrases:
          - Open the dishwasher.
          - Swing open the dishwasher door.
          - Pull the dishwasher door open.

    - 将餐具放入洗碗机:
        english: place the dishes into the dishwasher.
        paraphrases:
          - Put the dishes in the dishwasher.
          - Load the dishes into the dishwasher.
          - Place the dishes inside the dishwasher.

    - 关上洗碗机门:
        english: close the dishwasher door.
        paraphrases:
          - Shut the dishwasher door.
          - Close the dishwasher.
          - Push the dishwasher door closed.
